<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111428"><title>エンデュランス迷路</title><meta name="description" content="拍に合わせて変わる、1画面の迷路アクション。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111428'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='47' fill='%23ffe270'%3E俺%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="brand">エンデュランス<span>迷路</span></div><div class="hud"><div><small>BPM</small><b id="bpm">60</b></div><div><small>STAGE</small><b id="stage">1</b></div><div><small>SCORE</small><b id="score">0</b></div></div></header><div class="game-wrap"><canvas id="game" width="768" height="768" aria-label="16マス四方の迷路ゲーム"></canvas><div id="overlay" class="overlay"><div class="panel"><div class="eyebrow">ONE BAR / ONE STAGE</div><h1>俺をゴールへ</h1><p>マウス、または画面を押したまま動かして「俺」を導こう。壁と敵を避け、1小節以内に右側の虹色のゴールへ。</p><div class="presets"><button data-bpm="60">かんたん<small>BPM 60</small></button><button data-bpm="120">ふつう<small>BPM 120</small></button><button data-bpm="180">終わってる<small>BPM 180</small></button></div><label class="custom">BPMを入力 <input id="customBpm" type="number" min="30" max="300" value="60" inputmode="numeric"></label><fieldset class="enemy-options"><legend>敵の設定</legend><label><input type="radio" name="enemyMode" value="none">敵なし <b>×1</b></label><label><input type="radio" name="enemyMode" value="small">敵あり（小さくて止まってる） <b>×2</b></label><label><input type="radio" name="enemyMode" value="still" checked>敵あり（止まってる） <b>×3</b></label><label><input type="radio" name="enemyMode" value="moving">敵あり（動く） <b>×4</b></label></fieldset><button id="start" class="start">ゲーム開始</button><div id="result" class="result"></div><div id="share" class="share hidden"><div class="share-label">結果をシェア</div><a id="shareX" target="_blank" rel="noopener noreferrer">Xにポスト</a><a id="shareBsky" target="_blank" rel="noopener noreferrer">Blueskyにポスト</a></div></div></div></div><div class="foot"><span id="message">マウス／タップを押したまま操作</span><span id="time">0.0</span></div></main><script src="game.js"></script></body></html>
